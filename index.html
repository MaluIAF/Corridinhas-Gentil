<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Corridinhas Gentil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: faixa de largada em degradê (marinho→esmeralda) → módulos das corridinhas; cada módulo abre a consulta (praça + nome) → resultado */
:root{
  --navy:#0b3262; --teal:#076468; --emerald:#02af7a; --lime:#89ce42;
  --bg:#f3f7f8; --surface:#ffffff; --fg:#0b2440; --muted:#52677c; --line:#dbe5ea;
  --win:#02734f; --winbg:#e3f6ee; --focus:#02af7a;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#061a33; --surface:#0c2748; --fg:#e9f2f7; --muted:#9db2c6; --line:#1d3b60;
  --win:#3fdba7; --winbg:#0d3a3f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#061a33; --surface:#0c2748; --fg:#e9f2f7; --muted:#9db2c6; --line:#1d3b60;
  --win:#3fdba7; --winbg:#0d3a3f; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wide{max-width:960px}

.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy) 35%,var(--teal) 72%,var(--emerald) 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -1px -10%;height:40px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 22px,transparent 22px 44px);
  mask:linear-gradient(transparent,#000);-webkit-mask:linear-gradient(transparent,#000);pointer-events:none}
.hero .wrap{padding-block:24px 84px;position:relative;z-index:1}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:block;height:27px;width:auto}
.back{font:inherit;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.back:hover{background:rgba(255,255,255,.24)}
.eyebrow{margin-top:36px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
h1{margin:6px 0 0;font-size:clamp(32px,8vw,52px);font-weight:900;line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
h1 em{font-style:normal;color:var(--lime)}
.lede{margin:14px 0 0;font-size:16px;color:rgba(255,255,255,.9);max-width:46ch}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* MÓDULOS */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:-56px;position:relative;z-index:2;padding-bottom:40px}
.mod{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 14px 34px -20px rgba(11,50,98,.5)}
.mod .band{background:linear-gradient(135deg,var(--navy),var(--c));color:#fff;padding:18px 18px 20px;position:relative;overflow:hidden}
.mod .band::after{content:"";position:absolute;right:-8px;bottom:-1px;width:120px;height:100%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 10px,transparent 10px 20px);
  mask:linear-gradient(90deg,transparent,#000);-webkit-mask:linear-gradient(90deg,transparent,#000)}
.mod .ev{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.mod .tt{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.08;margin-top:4px;position:relative;z-index:1}
.mod .body{padding:16px 18px 18px;display:grid;gap:14px;flex:1}
.mod .nums{display:flex;gap:20px}
.mod .nums b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.mod .nums small{font-size:12px;color:var(--muted);font-weight:600}
.mod .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;color:var(--win);border-top:1px solid var(--line);padding-top:12px}
.mod .go svg{transition:transform .15s ease}
.mod:hover .go svg{transform:translateX(4px)}
.soon{border:2px dashed var(--line);border-radius:18px;display:grid;place-content:center;text-align:center;padding:28px 20px;color:var(--muted);min-height:200px;background:var(--bg)}
.soon b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.soon span{font-size:13px}

/* CONSULTA */
.box{background:var(--surface);border-radius:18px;padding:20px;margin-top:-56px;position:relative;z-index:2;box-shadow:0 14px 34px -20px rgba(11,50,98,.5);display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
select{appearance:none;-webkit-appearance:none;padding-right:40px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
#out{padding-block:22px 40px;display:grid;gap:10px}
.hint{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.res{background:var(--surface);border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;border-left:6px solid var(--emerald)}
.res .who{min-width:0}
.res .nm{font-weight:800;font-size:16px;line-height:1.3}
.res .lj{font-size:13px;color:var(--muted);margin-top:4px}
.res .lj b{color:var(--fg);font-weight:700}
.res .congrats{font-size:12px;font-weight:700;color:var(--win);margin-top:8px}
.prize{flex:none;text-align:center;background:var(--winbg);color:var(--win);border-radius:14px;padding:10px 14px;min-width:92px}
.prize small{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.prize b{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.prize b span{font-size:.55em;margin-right:2px}
mark{background:color-mix(in srgb,var(--lime) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.miss{background:var(--surface);border-radius:16px;padding:20px;text-align:center}
.miss b{display:block;font-size:16px;margin-bottom:4px}
.miss p{margin:0;color:var(--muted);font-size:14px}
footer .wrap{padding-block:8px 28px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:420px){.res{flex-direction:column;align-items:stretch}.prize{display:flex;justify-content:space-between;align-items:center;text-align:left}}
@media (prefers-reduced-motion:reduce){.mod .go svg{transition:none}}
</style>
</head><body>

  const i = norm(text).indexOf(q);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function render(){
  if(!atual) return;
  const q = norm($("q").value.trim()), pr = $("praca").value;
  if(q.length<3){ $("out").innerHTML = `<p class="hint">O resultado aparece aqui assim que você digitar seu nome.</p>`; return; }
  const words = q.split(" ");
  const list = atual.people.filter(p=>(!pr||p.praca===pr) && words.every(w=>norm(p.nome).includes(w)))
                           .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  if(!list.length){
    $("out").innerHTML = `<div class="miss"><b>Nenhum resultado encontrado</b><p>Confira a grafia do nome${pr?" ou troque a praça":""}.</p></div>`;
    return;
  }
  $("out").innerHTML = list.slice(0,30).map(p=>`<div class="res">
    <div class="who"><div class="nm">${words.length===1?hl(p.nome,q):esc(p.nome)}</div>
      <div class="lj"><b>${esc(p.loja)}</b> · ${esc(p.praca)}</div>
      <div class="congrats">Parabéns, você foi premiado(a)!</div></div>
    <div class="prize"><small>Prêmio</small><b><span>R$</span>${p.valor}</b></div></div>`).join("");
}
$("q").addEventListener("input", render);
$("praca").addEventListener("change", render);
$("f").addEventListener("submit", e=>{e.preventDefault(); $("q").blur();});

// Navegação por #id
function rota(){
  const id = location.hash.slice(1);
  const c = CORRIDINHAS.find(x=>x.id===id);
  $("home").hidden = !!c; $("consulta").hidden = !c;
  if(c){ if(atual!==c) abrir(c); }
  else { atual = null; $("foot").textContent = "Fonte: apurações oficiais das corridinhas."; }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", rota);
rota();
</script>
